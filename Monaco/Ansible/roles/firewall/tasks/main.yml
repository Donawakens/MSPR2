---
- name: Activer le routage IP
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Installer UFW et StrongSwan
  ansible.builtin.apt:
    name:
      - ufw
      - strongswan
    state: present
    update_cache: yes

- name: Activer le Forwarding dans UFW
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

- name: Activer UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Autoriser SSH / UDP IPsec / ESP
  community.general.ufw:
    rule: allow
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: '22', proto: 'tcp' }
    - { port: '500', proto: 'udp' }
    - { port: '4500', proto: 'udp' }
    - { proto: 'esp' }

- name: Identifier l'interface WAN
  ansible.builtin.command: ip -4 route show default
  register: default_route
  changed_when: false

- name: Définir l'interface WAN
  ansible.builtin.set_fact:
    wan_interface: "{{ default_route.stdout.split()[4] }}"

- name: Configurer le NAT dans /etc/ufw/before.rules
  ansible.builtin.blockinfile:
    path: /etc/ufw/before.rules
    insertbefore: BOF
    block: |
      *nat
      :POSTROUTING ACCEPT [0:0]
      -A POSTROUTING -s 192.168.0.0/16 -d 192.168.0.0/16 -j ACCEPT
      -A POSTROUTING -s 192.168.20.0/24 -o {{ wan_interface }} -j MASQUERADE
      -A POSTROUTING -s 192.168.21.0/24 -o {{ wan_interface }} -j MASQUERADE
      COMMIT

- name: Configurer la clé PSK
  ansible.builtin.copy:
    dest: /etc/ipsec.secrets
    owner: root
    group: root
    mode: '0600'
    content: |
      172.16.158.5 172.16.158.3 : PSK "SecretVPN123!"

- name: Configurer le tunnel IPsec vers Londres
  ansible.builtin.copy:
    dest: /etc/ipsec.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      config setup
          charondebug="ike 1, knl 1, cfg 1"

      conn mco-to-ldn
          keyexchange=ikev2
          authby=secret
          type=tunnel
          auto=start
          left=172.16.158.5
          leftsubnet=192.168.20.0/24,192.168.21.0/24
          right=172.16.158.3
          rightsubnet=192.168.10.0/24,192.168.11.0/24,192.168.40.0/24,192.168.41.0/24,192.168.50.0/24

- name: Redémarrer StrongSwan et Recharger UFW
  ansible.builtin.systemd:
    name: strongswan
    state: restarted
    enabled: yes

- name: Recharger UFW
  community.general.ufw:
    state: reloaded