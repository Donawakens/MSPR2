---
- name: Copier le script PowerShell sur la machine cible
  ansible.windows.win_copy:
    src: "{{ item }}"
    dest: "C:\\Windows\\Temp\\{{ item }}"
  loop:
    - deploy_secondary_dc.ps1

- name: Déployer le contrôleur de domaine secondaire (BDC USA)
  ansible.windows.win_powershell:
    script: |
      C:\Windows\Temp\deploy_secondary_dc.ps1 `
        -DomainName "{{ ad_domain_name }}" `
        -PrimaryDcIp "192.168.11.2" `
        -DomainAdminUser "{{ ad_admin_user }}" `
        -DomainAdminPassword "{{ ad_admin_password }}" `
        -DsrmPassword "{{ ad_dsrm_password }}"
  when: inventory_hostname == "WIN-SRV-2"