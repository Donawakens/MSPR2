---
- name: Déploiement du Pare-feu et préparation VPN / VLANs
  hosts: firewall
  become: yes

  roles:
    - firewall

- name: Déploiement du Contrôleur de Domaine Secondaire (USA)
  hosts: WIN-SRV-2
  vars:
    ad_domain_name: "atp.local"
    ad_admin_user: "Administrateur"
    ad_admin_password: "Adminadmin1234"
    ad_dsrm_password: "Adminpassword1234"
  roles:
    - active_directory