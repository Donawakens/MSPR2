[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/MSPR2/Common/ansible_key
ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[admin]
ADMIN-SRV-1 ansible_host=192.168.11.10

# --- Groupes Nextcloud ---
[nextcloud_london]
FILE-SRV-1 ansible_host=192.168.11.3

[nextcloud_dc]
FILE-SRV-3 ansible_host=192.168.50.2

[nextcloud:children]
nextcloud_london
nextcloud_dc

[supervision]
SUP-SRV-1 ansible_host=192.168.11.4

# --- Groupes Firewall ---
[firewall_london]
FW-LDN-1 ansible_host=172.16.158.3

[firewall_dc]
FW-DC-1 ansible_host=172.16.158.9

[firewall_aus]
FW-AUST-1 ansible_host=172.16.158.6

[firewall:children]
firewall_london
firewall_dc
firewall_aus

[firewall:vars]
firewall_vlan10_ip=192.168.10.1
firewall_vlan11_ip=192.168.11.1
firewall_vlan30_ip=192.168.30.1
firewall_vlan50_ip=192.168.50.1

[linux:children]
admin
nextcloud
supervision
firewall

[windows]
WIN-SRV-1 ansible_host=192.168.11.2
BV-SRV-1  ansible_host=192.168.11.5

[windows:vars]
ansible_user=ansible
ansible_password=Adminadmin1234
ansible_connection=winrm
ansible_port=5986
ansible_winrm_scheme=https
ansible_winrm_server_cert_validation=ignore
ansible_winrm_transport=basic