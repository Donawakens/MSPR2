---
- name: Installer Docker et Docker Compose
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - curl
    state: present
    update_cache: yes

- name: S'assurer que le service Docker est démarré
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: yes

- name: Créer le dossier d'installation Sync-in
  ansible.builtin.file:
    path: /opt/syncin
    state: directory
    mode: '0755'

- name: Déployer le fichier environment.yaml
  ansible.builtin.template:
    src: environment.yaml.j2
    dest: /opt/syncin/environment.yaml
    mode: '0644'

- name: Déployer le fichier docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/syncin/docker-compose.yml
    mode: '0640'

- name: Lancer la stack Sync-in via Docker Compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/syncin
  register: docker_compose_result
  changed_when: "'Creating' in docker_compose_result.stdout or 'Starting' in docker_compose_result.stdout or 'Recreating' in docker_compose_result.stdout"