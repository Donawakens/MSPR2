---
- name: Activer le routage IP (Mode Routeur)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Installer UFW et outils VPN / Sécurité
  ansible.builtin.apt:
    name:
      - ufw
      - strongswan
      - strongswan-pki
    state: present
    update_cache: yes

- name: Autoriser le Forwarding dans UFW
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

- name: Configurer UFW - Autoriser SSH
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Configurer UFW - Autoriser les flux VPN IPsec (UDP 500 & 4500)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop:
    - '500'
    - '4500'

- name: Activer le Pare-feu UFW
  community.general.ufw:
    state: enabled
    policy: deny