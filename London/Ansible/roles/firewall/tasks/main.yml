---
- name: Activer le routage IP (Mode Routeur)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes

- name: Installer UFW et StrongSwan
  ansible.builtin.apt:
    name:
      - ufw
      - strongswan
    state: present
    update_cache: yes

- name: Activer le Forwarding dans UFW
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'

- name: Activer UFW
  community.general.ufw:
    state: enabled
    policy: deny

- name: Autoriser SSH
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Autoriser IKE et NAT-T (UDP 500/4500)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop:
    - '500'
    - '4500'

- name: Autoriser le protocole ESP
  community.general.ufw:
    rule: allow
    proto: esp

- name: Identifier l'interface WAN
  ansible.builtin.command: ip -4 route show default
  register: default_route
  changed_when: false

- name: Définir l'interface WAN
  ansible.builtin.set_fact:
    wan_interface: "{{ default_route.stdout.split()[4] }}"

- name: Configurer le NAT dans /etc/ufw/before.rules (avec exclusion VPN)
  ansible.builtin.blockinfile:
    path: /etc/ufw/before.rules
    insertbefore: BOF
    block: |
      *nat
      :POSTROUTING ACCEPT [0:0]
      # Ne PAS appliquer le NAT pour le trafic inter-VLANs distants (VPN)
      -A POSTROUTING -s 192.168.0.0/16 -d 192.168.0.0/16 -j ACCEPT
      # NAT Internet pour le LAN Londres
      -A POSTROUTING -s 192.168.10.0/24 -o {{ wan_interface }} -j MASQUERADE
      -A POSTROUTING -s 192.168.11.0/24 -o {{ wan_interface }} -j MASQUERADE
      COMMIT

- name: Configurer les clés PSK IPsec
  ansible.builtin.copy:
    dest: /etc/ipsec.secrets
    owner: root
    group: root
    mode: '0600'
    content: |
      172.16.158.3 172.16.158.5 : PSK "SecretVPN123!"
      172.16.158.3 172.16.158.8 : PSK "SecretVPN123!"
      172.16.158.3 172.16.158.9 : PSK "SecretVPN123!"

- name: Configurer les tunnels IPsec
  ansible.builtin.copy:
    dest: /etc/ipsec.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      config setup
          charondebug="ike 1, knl 1, cfg 1"

      conn %default
          keyexchange=ikev2
          authby=secret
          type=tunnel
          auto=start

      # Tunnel vers MONACO
      conn ldn-to-mco
          left=172.16.158.3
          leftsubnet=192.168.10.0/24,192.168.11.0/24,192.168.40.0/24,192.168.41.0/24,192.168.50.0/24
          right=172.16.158.5
          rightsubnet=192.168.20.0/24,192.168.21.0/24

      # Tunnel vers USA
      conn ldn-to-usa
          left=172.16.158.3
          leftsubnet=192.168.10.0/24,192.168.11.0/24,192.168.20.0/24,192.168.21.0/24,192.168.50.0/24
          right=172.16.158.8
          rightsubnet=192.168.40.0/24,192.168.41.0/24

      # Tunnel vers DATACENTER
      conn ldn-to-dc
          left=172.16.158.3
          leftsubnet=192.168.10.0/24,192.168.11.0/24,192.168.20.0/24,192.168.21.0/24,192.168.40.0/24,192.168.41.0/24
          right=172.16.158.9
          rightsubnet=192.168.50.0/24

- name: Redémarrer StrongSwan et Recharger UFW
  ansible.builtin.systemd:
    name: strongswan-starter
    state: restarted
    enabled: yes

- name: Recharger UFW
  community.general.ufw:
    state: reloaded